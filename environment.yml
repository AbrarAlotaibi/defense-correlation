# Standalone conda environment for the defense-correlation experiment.
#   conda env create -f environment.yml && conda activate defense-correlation
#
# Assumes a CUDA 12.x driver. On Kaggle you do NOT need this - the notebook installs the
# few missing packages on top of the base image (see kaggle/run_experiment.ipynb).
name: defense-correlation
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pytorch>=2.4
  - pytorch-cuda=12.4
  - pip
  - pip:
      - transformers>=4.45
      - accelerate>=0.34
      - bitsandbytes>=0.43
      - datasets>=2.20
      - huggingface_hub>=0.24
      - numpy>=1.26
      - pandas>=2.0
      - scipy>=1.11
      - statsmodels>=0.14
      - scikit-learn>=1.3
      - matplotlib>=3.8
      - openai>=1.40
      - pyyaml>=6.0
      - tqdm>=4.66
      - pytest>=8.0
